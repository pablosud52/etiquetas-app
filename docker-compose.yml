version: '3.8'

services:
  etiquetas-app:
    image: ghcr.io/pablosud52/etiquetas-app:latest
    build: .
    container_name: etiquetas-app
    restart: unless-stopped
    ports:
      - "1010:8080"
    environment:
      - TZ=America/Montevideo
      - PORT=8080
      - DB_PATH=/app/data/etiquetas.db
      - UPLOADS_DIR=/app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
