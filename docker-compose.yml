version: '3.8'

services:
  etiquetas-app:
    build: .
    container_name: etiquetas-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/etiquetas.db
      - UPLOADS_DIR=/app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
