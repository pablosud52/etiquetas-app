<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="printerGrad" x1="14" y1="20" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="22" y1="13" x2="42" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fondo redondeado estilo App Icon -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#334155" stroke-width="1.5" />

  <!-- Marcas guía de corte exteriores (Crop Marks) -->
  <g stroke="#38bdf8" stroke-width="1.3" opacity="0.75" stroke-linecap="round">
    <path d="M9 13 H12 M12 10 V13" />
    <path d="M52 10 V13 M52 13 H55" />
    <path d="M9 51 H12 M12 51 V54" />
    <path d="M52 54 V51 M52 51 H55" />
  </g>

  <!-- Papel Superior Entrante -->
  <rect x="23" y="13" width="18" height="11" rx="2" fill="url(#paperGrad)" />
  <line x1="26" y1="17" x2="38" y2="17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="26" y1="20" x2="34" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cuerpo Principal de la Impresora -->
  <rect x="14" y="21" width="36" height="21" rx="5" fill="url(#printerGrad)" filter="url(#shadow)" />
  <rect x="14" y="21" width="36" height="21" rx="5" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4" />

  <!-- Luces LED de Estado -->
  <circle cx="20" cy="27" r="1.6" fill="#10b981" />
  <circle cx="24.5" cy="27" r="1.6" fill="#38bdf8" />

  <!-- Ranura de Salida de Impresión -->
  <rect x="20" y="32" width="24" height="3" rx="1.2" fill="#09101d" />

  <!-- Etiqueta de Precio Saliendo de la Impresora -->
  <g filter="url(#shadow)">
    <rect x="22" y="33" width="20" height="18" rx="2.5" fill="#ffffff" />
    <!-- Líneas simulando etiqueta de precio impresa -->
    <rect x="25" y="37" width="14" height="2.2" rx="0.6" fill="#2563eb" />
    <rect x="25" y="41" width="8" height="1.6" rx="0.5" fill="#0f172a" />
    <rect x="35" y="41" width="4" height="1.6" rx="0.5" fill="#10b981" />
    <!-- Código de barras minimalista en la etiqueta -->
    <line x1="25" y1="45" x2="25" y2="48" stroke="#334155" stroke-width="1.2" />
    <line x1="27.5" y1="45" x2="27.5" y2="48" stroke="#334155" stroke-width="1.8" />
    <line x1="31" y1="45" x2="31" y2="48" stroke="#334155" stroke-width="1" />
    <line x1="33.5" y1="45" x2="33.5" y2="48" stroke="#334155" stroke-width="2" />
    <line x1="37" y1="45" x2="37" y2="48" stroke="#334155" stroke-width="1.2" />
  </g>
</svg>
