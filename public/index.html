<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etiquetas de Precios</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Google Fonts: Inter, Bebas Neue, Montserrat, Oswald, Anton, Roboto, Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- VISTA DE LOGIN -->
  <div id="login-wrapper" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-8 w-full max-w-md shadow-2xl space-y-5">
      <div class="text-center space-y-2">
        <img src="/favicon.svg" alt="Logo OFM" class="w-14 h-14 mx-auto drop-shadow-lg rounded-2xl">
        <h1 class="text-2xl font-bold tracking-tight text-white">Etiquetas de Precios</h1>
        <p class="text-xs text-slate-400">Ingresa tus credenciales para acceder al sistema</p>
      </div>

      <div id="login-error" class="hidden p-3 bg-red-900/30 border border-red-500/40 text-red-300 text-xs rounded-lg text-center font-medium"></div>

      <form id="login-form" onsubmit="iniciarSesion(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Usuario</label>
          <input type="text" id="username" name="username" required autocomplete="username" autofocus
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Contraseña</label>
          <div class="relative">
            <input type="password" id="password" name="password" required autocomplete="current-password"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition pr-10">
            <button type="button" onclick="togglePass('password')" class="absolute right-3 top-2.5 text-slate-400 hover:text-white transition-colors cursor-pointer" title="Mostrar/Ocultar Contraseña">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition duration-150 shadow-lg shadow-blue-600/20 text-sm mt-2 cursor-pointer">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <!-- VISTA DEL PANEL PRINCIPAL (DASHBOARD) -->
  <div id="dashboard-wrapper" class="hidden flex-1 flex flex-col min-h-screen">
    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700/80 px-6 py-3.5 flex items-center justify-between shadow-md">
      <div class="flex items-center space-x-8">
        <h2 class="text-lg font-bold tracking-tight text-white flex items-center gap-2.5">
          <img src="/favicon.svg" alt="Logo OFM" class="w-7 h-7 rounded-lg shadow-sm">
          <span>Etiquetas de Precios</span>
        </h2>
        
        <!-- Pestañas de Navegación (Se ocultan por completo para el rol Operador) -->
        <nav id="tabs-container" class="flex space-x-1 bg-slate-900/60 p-1 rounded-lg border border-slate-700/50">
          <button id="tab-generador" data-target-module="generador" onclick="loadComponent('generador')" class="nav-tab px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors bg-slate-700 text-white">Generador</button>
          <button id="tab-plantillas" data-target-module="plantillas" onclick="loadComponent('plantillas')" class="nav-tab px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors text-slate-400 hover:text-slate-200">Plantillas</button>
          <button id="tab-datos" data-target-module="datos" onclick="loadComponent('datos')" class="nav-tab px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors text-slate-400 hover:text-slate-200">Datos</button>
          <button id="tab-usuarios" data-target-module="usuarios" onclick="loadComponent('usuarios')" class="nav-tab px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors text-slate-400 hover:text-slate-200">Usuarios y Backup</button>
        </nav>
      </div>

      <!-- Usuario y Botón Cerrar Sesión -->
      <div class="flex items-center space-x-5">
        <span id="current-user-display" class="text-sm font-medium text-slate-200"></span>
        <button id="logout-btn" onclick="logout()" class="text-sm text-slate-400 hover:text-red-400 transition-colors font-medium cursor-pointer">Cerrar Sesión</button>
      </div>
    </header>

    <!-- Contenedor dinámico principal -->
    <main id="main-content" class="flex-1 p-6">
      <!-- Los módulos (generador, plantillas, datos, usuarios) se inyectan aquí -->
    </main>
  </div>

  <!-- Scripts de Módulos y Lógica -->
  <script src="/js/generador.js"></script>
  <script src="/js/editor-imposicion.js"></script>
  <script src="/js/editor-diseno.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/datos.js"></script>
  <script src="/js/backup.js"></script>
  <script src="/js/usuarios.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
